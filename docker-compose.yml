services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-store"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - medusa_network

  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medusa_network

  medusa:
    build: .
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/medusa-store
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - COOKIE_SECRET=${COOKIE_SECRET:-supersecret}
      - STORE_CORS=${STORE_CORS:-http://localhost:8000,http://localhost:8001}
      - ADMIN_CORS=${ADMIN_CORS:-http://localhost:5173,http://localhost:9000}
      - AUTH_CORS=${AUTH_CORS:-http://localhost:5173,http://localhost:9000}
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - medusa_network
      - dokploy-network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge
  dokploy-network:
    external: true
